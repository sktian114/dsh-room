name: publish

# 打 tag（v*）时自动发布到 npm；也可以用 workflow_dispatch 手动跑一次。
# 需要仓库 secrets 里配置 NPM_TOKEN（npm 账号的 Granular Access Token，勾选
# 「Read and write」+ 只授权 @sktian114 这个 scope）。
#
# 注意：桌面版 profile 不允许 `dsh plugin add`，所以 npm 包只是「分发载体」，
# 用户装完还要跑一次包里的 install.mjs 才能挂进 DSH（见 README）。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write        # npm provenance

jobs:
  publish:
    runs-on: windows-latest
    env:
      # 没配 NPM_TOKEN 时整个发布步骤跳过（只跑测试+校验），不会把首发的 CI 弄红
      HAS_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: 先跑一遍测试（不绿不发）
        run: npm test

      - name: 检查发布包内容（test/ 与 docs/ 不应进包）
        run: npm pack --dry-run

      - name: 版本号必须和 tag 一致
        shell: pwsh
        run: |
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($pkg -ne $tag) { throw "package.json 版本 $pkg 和 tag $tag 不一致" }
          Write-Host "版本一致：$pkg"

      # 手动 `npm publish` 之后再推 tag 也不会红：已经发过的版本直接跳过。
      - name: 这个版本是否已经发布
        id: check
        shell: pwsh
        run: |
          $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $existing = npm view "@sktian114/dsh-room@$ver" version 2>$null
          if ($LASTEXITCODE -eq 0 -and $existing) {
            Write-Host "npm 上已有 $ver，跳过发布"
            "published=yes" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            Write-Host "npm 上还没有 $ver，准备发布"
            "published=no" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }
          # pwsh 步骤结束时会拿 $LASTEXITCODE 当退出码：`npm view` 查不到包返回 1，
          # 不清零就会把这一步判成失败（2026-10-25 首发就是这么红的）。
          $global:LASTEXITCODE = 0
          exit 0

      - name: 发布到 npm
        if: github.event_name == 'push' && steps.check.outputs.published == 'no' && env.HAS_TOKEN == 'true'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
